recipes:
  - id: 7cb2740e-4dbb-5fa3-9c68-e446ea7b917a
    name: Tomato egg rice
    description: A fast, comforting rice bowl with soft eggs and juicy tomatoes.
    base_servings: 2
    ingredients:
      - ingredient_id: 93de2904-5359-5dca-9c36-17611d9f7a86
        quantity: '300.000'
        quantity_input: '300'
        unit: g
      - ingredient_id: aa66189c-9b98-5d41-b4df-c22d901e4710
        quantity: '2.000'
        quantity_input: '2'
        unit: item
      - ingredient_id: de2d9167-7635-5f65-a749-3749fdcb9b72
        quantity: '3.000'
        quantity_input: '3'
